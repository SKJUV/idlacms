name: Auto-Merge Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    name: Enable GitHub Auto-Merge for Repository Collaborators Only
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    # Workflow d'auto-merge réactivé pour les collaborateurs officiels
    # if: false

    steps:
      - name: 🔍 Vérifier le statut de collaborateur officiel
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          ASSOCIATION="${{ github.event.pull_request.author_association }}"
          echo "Auteur de la PR: $AUTHOR (Association: $ASSOCIATION)"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators/$AUTHOR")

          if [ "$HTTP_STATUS" -eq 204 ] || [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ L'utilisateur $AUTHOR est bien un collaborateur officiel du dépôt."
          else
            echo "❌ L'utilisateur $AUTHOR n'est pas un collaborateur officiel. Auto-merge bloqué."
            exit 1
          fi

      - name: 🤖 Fusionner la Pull Request
        run: |
          gh pr merge "${{ github.event.pull_request.html_url }}" --admin --squash || gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash || gh pr merge "${{ github.event.pull_request.html_url }}" --squash || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
